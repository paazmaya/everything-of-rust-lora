[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-lora"
version = "0.1.0"
license = "MIT"
readme = "README.md"
description = "Training a LoRA that knows everything about the Rust language"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "chromadb>=1.5.9",
  "datasets>=4.5.0",
  "feedparser>=6.0.12",
  "flash-linear-attention>=0.5.0",
  "gguf>=0.19.0",
  "html2text>=2025.4.15",
  "huggingface-hub>=0.20.0",
  "langchain>=1.3.2",
  "llama-cpp-python>=0.3.35",
  "lxml>=6.1.1",
  "markdown>=3.10.2",
  "pandas>=3.0.3",
  "peft>=0.19.1",
  "pyarrow>=24.0.0",
  "requests>=2.34.2",
  "tiktoken>=0.13.0",
  "torch==2.10.0 ; sys_platform == 'win32'",
  "torchvision>=0.25.0 ; sys_platform == 'win32'",
  "tqdm>=4.67.3",
  "transformers>=5.5.0",
  "trl>=0.24.0",
  "unsloth[colab-new]>=2026.5.8",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data", "config", "unsloth_compiled_cache"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.15.14"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
  "I", # isort
  "C", # flake8-comprehensions
  "B", # flake8-bugbear
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long, handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --cov=lib --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
source = ["lib"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
